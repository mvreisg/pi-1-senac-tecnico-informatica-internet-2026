<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirma - Validação</title>
    <link rel="stylesheet" href="./../header.css" />
    <link rel="stylesheet" href="./validation.css" />
    <script src="./../../session.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <img src="./../../assets/logo.png" alt="Logo do Confirma" />
        <nav class="nav">
          <ul>
            <li><a href="./../home/home.html">Home</a></li>
            <li><a href="./../orders/orders.html">Pedidos</a></li>
            <li><a href="./../qrcode/qrcode.html">QR Code</a></li>
            <li><a href="./validation.html">Validação</a></li>
            <li><a href="./../../login/login.html?logoff=true">Sair</a></li>
          </ul>
        </nav>
      </header>
      <main class="body">
        <div>
          <section class="ticket">
            <header>
              <h2>Validação da Entrega</h2>
              <p>Pedido #133</p>
            </header>
            <article>
              <p class="customer">
                <span class="label">Cliente: </span
                ><span class="value">João da Silva</span>
              </p>
              <p class="date">
                <span class="label">Data: </span
                ><span class="value">17/08/2026</span>
              </p>
              <p class="time">
                <span class="label">Hora: </span
                ><span class="value">15:37:56</span>
              </p>
              <table class="items">
                <tr>
                  <th>Quantidade</th>
                  <th>Item</th>
                  <th>Preço</th>
                </tr>
                <tr>
                  <td>1</td>
                  <td>X-Bacon</td>
                  <td>R$ 7,00</td>
                </tr>
                <tr>
                  <td>1</td>
                  <td>Coca-Cola</td>
                  <td>R$ 12,00</td>
                </tr>
                <tr>
                  <td>1</td>
                  <td>Batata-Frita</td>
                  <td>R$ 6,00</td>
                </tr>
              </table>
              <p class="total">
                <span class="label">Total: </span
                ><span class="value">R$ 37,50</span>
              </p>
              <button class="confirm">Confirmar</button>
            </article>
          </section>
        </div>
      </main>
      <footer class="footer">
        <span class="copyright">&copy; Confirma - 2026</span>
      </footer>
    </main>
  </body>
</html>
