<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirma - Home</title>
    <link rel="stylesheet" href="./../../globals.css" />
    <link rel="stylesheet" href="./../header.css" />
    <link rel="stylesheet" href="./orders.css" />
    <script src="./../../session.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <img src="./../../assets/logo.png" alt="Logo do Confirma" />
        <nav class="nav">
          <ul>
            <li><a href="./../home/home.html">Home</a></li>
            <li><a href="./orders.html">Pedidos</a></li>
            <li><a href="./../qrcode/qrcode.html">QR Code</a></li>
            <li><a href="./../validation/validation.html">Validação</a></li>
            <li><a href="./../../login/login.html?logoff=true">Sair</a></li>
          </ul>
        </nav>
      </header>
      <main class="body">
        <h2>Pedidos</h2>
        <div>
          <section class="received">
            <header><h3>Recebidos</h3></header>
            <main>
              <div class="card">
                <p>Pedido #123</p>
                <div>
                  <button class="production button">
                    Enviar para produção
                  </button>
                  <button class="remove button">Remover</button>
                </div>
              </div>
            </main>
            <footer>
              <button>Adicionar novo</button>
            </footer>
          </section>
          <section class="in-production">
            <header>
              <h3>Em produção</h3>
            </header>
            <main>
              <div class="card">
                <p>Pedido #123</p>
                <div>
                  <button class="ready button">Marcar como pronto</button>
                  <button class="remove button">Remover</button>
                </div>
              </div>
            </main>
          </section>
          <section class="ready">
            <header>
              <h3>Prontos</h3>
            </header>
            <main>
              <div class="card">
                <p>Pedido #123</p>
                <div>
                  <button class="dispatch button">Despachar</button>
                  <button class="remove button">Remover</button>
                </div>
              </div>
            </main>
          </section>
          <section class="dispatched">
            <header><h3>Despachados</h3></header>
            <main>
              <div class="card">
                <p>Pedido #123</p>
                <div>
                  <button class="track button">Acompanhar rastreio</button>
                  <button class="remove button">Remover</button>
                </div>
              </div>
            </main>
          </section>
          <section class="done">
            <header><h3>Entregues</h3></header>
            <main>
              <div class="card">
                <p>Pedido #123</p>
                <div>
                  <button class="remove button">Remover</button>
                </div>
              </div>
            </main>
          </section>
        </div>
      </main>
      <footer class="footer">
        <span class="copyright">&copy; Confirma - 2026</span>
      </footer>
    </main>
  </body>
</html>
